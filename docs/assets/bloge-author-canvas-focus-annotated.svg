<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">BLOGE Author Canvas Focus mode annotated layout</title>
  <desc id="desc">Annotated corporate-style diagram showing Canvas Focus mode expanding the central React Flow canvas by hiding side panels, workflow, and example cards.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102033" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#eef2f7"/>

  <rect x="54" y="46" width="1172" height="628" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <rect x="54" y="46" width="1172" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="82" y="82" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">BLOGE Author Canvas</text>
  <text x="1048" y="80" font-family="Arial, sans-serif" font-size="13" fill="#64748b">/author/ focus review</text>

  <rect x="80" y="126" width="1120" height="46" rx="7" fill="#f8fafc" stroke="#d7dee8"/>
  <rect x="96" y="138" width="126" height="22" rx="4" fill="#e2e8f0"/>
  <rect x="238" y="138" width="126" height="22" rx="4" fill="#e2e8f0"/>
  <rect x="380" y="138" width="126" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="407" y="154" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Canvas Focus</text>
  <rect x="520" y="138" width="126" height="22" rx="4" fill="#e2e8f0"/>
  <rect x="662" y="138" width="126" height="22" rx="4" fill="#e2e8f0"/>
  <rect x="990" y="138" width="82" height="22" rx="4" fill="#eef2ff"/>
  <text x="1008" y="154" font-family="Arial, sans-serif" font-size="12" fill="#475569">5 nodes</text>

  <rect x="80" y="190" width="1120" height="66" rx="7" fill="#f8fafc" stroke="#d7dee8"/>
  <text x="100" y="216" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Graph Contract</text>
  <rect x="248" y="204" width="376" height="38" rx="5" fill="#ffffff" stroke="#d7dee8"/>
  <text x="266" y="228" font-family="Arial, sans-serif" font-size="12" fill="#475569">Input ctx: applicantId, score, amount</text>
  <rect x="646" y="204" width="376" height="38" rx="5" fill="#ffffff" stroke="#d7dee8"/>
  <text x="664" y="228" font-family="Arial, sans-serif" font-size="12" fill="#475569">Output public result: decision, reason</text>

  <rect x="80" y="276" width="1120" height="360" rx="8" fill="#f8fbff" stroke="#94a3b8" stroke-width="2"/>
  <text x="100" y="306" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Expanded React Flow viewport</text>
  <text x="100" y="326" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Side panels and examples are hidden only while reviewing the topology.</text>

  <g>
    <rect x="180" y="374" width="178" height="72" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="202" y="404" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">Fetch Applicant</text>
    <text x="202" y="426" font-family="Arial, sans-serif" font-size="11" fill="#64748b">resource:getProfile</text>

    <rect x="486" y="344" width="178" height="72" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="508" y="374" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">Eligibility</text>
    <text x="508" y="396" font-family="Arial, sans-serif" font-size="11" fill="#64748b">decision table</text>

    <rect x="486" y="478" width="178" height="72" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <text x="508" y="508" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">Risk Transform</text>
    <text x="508" y="530" font-family="Arial, sans-serif" font-size="11" fill="#64748b">bloge:transform</text>

    <rect x="790" y="410" width="178" height="72" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="812" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">Final Response</text>
    <text x="812" y="462" font-family="Arial, sans-serif" font-size="11" fill="#64748b">public output</text>

    <path d="M358 410 C410 410 430 380 486 380" fill="none" stroke="#64748b" stroke-width="2.2"/>
    <path d="M358 420 C410 470 430 514 486 514" fill="none" stroke="#64748b" stroke-width="2.2"/>
    <path d="M664 380 C714 386 738 430 790 438" fill="none" stroke="#64748b" stroke-width="2.2"/>
    <path d="M664 514 C720 506 742 456 790 450" fill="none" stroke="#64748b" stroke-width="2.2"/>
    <text x="386" y="392" font-family="Arial, sans-serif" font-size="10" fill="#475569">profile.score -> score</text>
    <text x="682" y="412" font-family="Arial, sans-serif" font-size="10" fill="#475569">approved -> decision</text>
  </g>

  <rect x="78" y="276" width="1" height="360" fill="#e2e8f0"/>
  <rect x="1201" y="276" width="1" height="360" fill="#e2e8f0"/>
  <text x="36" y="456" transform="rotate(-90 36 456)" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">hidden palette</text>
  <text x="1244" y="470" transform="rotate(90 1244 470)" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">hidden inspector</text>

  <g fill="#fff7ed" stroke="#f97316" stroke-width="2">
    <circle cx="410" cy="138" r="15"/>
    <circle cx="80" cy="456" r="15"/>
    <circle cx="640" cy="266" r="15"/>
    <circle cx="1106" cy="456" r="15"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#9a3412" text-anchor="middle">
    <text x="410" y="142">1</text>
    <text x="80" y="460">2</text>
    <text x="640" y="270">3</text>
    <text x="1106" y="460">4</text>
  </g>

  <path d="M410 122 L430 86" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="438" y="82" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">one-click focus toggle</text>
  <path d="M95 456 L162 422" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="108" y="482" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">side panels collapse</text>
  <path d="M640 250 L640 206" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="662" y="268" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">examples hidden in focus</text>
  <path d="M1090 456 L968 446" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="958" y="586" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">larger topology review area</text>
</svg>
