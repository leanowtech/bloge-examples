<svg xmlns="http://www.w3.org/2000/svg" width="725" height="725" viewBox="0 0 725 725" role="img" aria-labelledby="title desc">
  <title id="title">BLOGE Author Legacy DSL Import</title>
  <desc id="desc">Annotated screenshot showing DSL source, Render DSL, Commit Draft, stored draft notice, source map, and selected source reference.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#172033" flood-opacity="0.22"/>
    </filter>
    <style>
      .mark { fill: none; stroke: #1f6feb; stroke-width: 3; rx: 8; }
      .accent { fill: none; stroke: #f59e0b; stroke-width: 3; rx: 8; }
      .label { fill: #172033; font: 700 13px Arial, sans-serif; }
      .bubble { fill: #ffffff; stroke: #1f6feb; stroke-width: 2; filter: url(#shadow); }
      .bubble-accent { fill: #ffffff; stroke: #f59e0b; stroke-width: 2; filter: url(#shadow); }
      .num { fill: #1f6feb; font: 800 14px Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
      .num-accent { fill: #b45309; font: 800 14px Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <image href="bloge-author-legacy-dsl-source-map.png" x="0" y="0" width="725" height="725"/>

  <rect class="mark" x="13" y="44" width="699" height="191"/>
  <circle class="bubble" cx="33" cy="66" r="15"/>
  <text class="num" x="33" y="66">1</text>
  <text class="label" x="54" y="71">Existing .bloge DSL</text>

  <rect class="mark" x="13" y="318" width="699" height="94"/>
  <circle class="bubble" cx="33" cy="337" r="15"/>
  <text class="num" x="33" y="337">2</text>
  <text class="label" x="54" y="342">Render and commit with valid schema</text>

  <rect class="mark" x="14" y="451" width="697" height="270"/>
  <circle class="bubble" cx="34" cy="470" r="15"/>
  <text class="num" x="34" y="470">3</text>
  <text class="label" x="55" y="475">Source map refs</text>

  <rect class="accent" x="22" y="637" width="681" height="43"/>
  <circle class="bubble-accent" cx="674" cy="658" r="15"/>
  <text class="num-accent" x="674" y="658">4</text>
  <text class="label" x="486" y="663">Click row to select node</text>
</svg>
