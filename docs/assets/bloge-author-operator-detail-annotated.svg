<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">BLOGE Author Operator Detail Editing Dialog</title>
  <desc id="desc">Annotated product diagram showing a canvas node double-click opening the operator details dialog with editable key properties, input bindings, output samples, schema summaries, and advanced config.</desc>
  <defs>
    <style>
      .bg{fill:#f5f7fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.soft{fill:#fbfcff;stroke:#cbd5e1}.resource{fill:#f2fbff;stroke:#74b7d2}.muted{fill:#64748b}.ink{fill:#172033}.blue{fill:#2563eb}.green{fill:#0f766e}.amber{fill:#b26a00}.line{stroke:#94a3b8;stroke-width:3;fill:none}.call{fill:#0f172a}.num{fill:#fff;font:700 18px Inter,Arial}.txt{font:600 18px Inter,Arial;fill:#172033}.small{font:500 14px Inter,Arial;fill:#475569}.label{font:800 11px Inter,Arial;fill:#64748b;text-transform:uppercase}.code{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}
    </style>
  </defs>
  <rect width="1280" height="720" class="bg"/>

  <rect x="36" y="38" width="286" height="644" rx="10" class="panel"/>
  <text x="62" y="76" class="txt">Operator Palette</text>
  <rect x="62" y="104" width="226" height="78" rx="8" class="resource" stroke-width="2"/>
  <text x="82" y="134" class="txt">HTTP Resource</text>
  <text x="82" y="158" class="small">request params -> payload</text>
  <rect x="62" y="202" width="226" height="78" rx="8" fill="#fbf7ff" stroke="#c5a3e5" stroke-width="2"/>
  <text x="82" y="232" class="txt">Transform</text>
  <text x="82" y="256" class="small">source fields -> output</text>

  <rect x="346" y="38" width="490" height="644" rx="10" class="panel"/>
  <text x="374" y="76" class="txt">Canvas</text>
  <rect x="410" y="154" width="246" height="146" rx="8" class="resource" stroke-width="3"/>
  <text x="432" y="190" class="txt">Customer HTTP call</text>
  <text x="432" y="218" class="small">httpResource</text>
  <text x="432" y="248" class="code">In: input</text>
  <text x="432" y="272" class="code">Out: output</text>
  <path d="M656 228 C702 228 712 228 756 228" class="line"/>
  <rect x="756" y="154" width="246" height="146" rx="8" fill="#fbf7ff" stroke="#c5a3e5" stroke-width="3"/>
  <text x="778" y="190" class="txt">Assemble response</text>
  <text x="778" y="218" class="small">bloge:transform</text>
  <text x="778" y="248" class="code">In: inputs</text>
  <text x="778" y="272" class="code">Out: output</text>
  <circle cx="532" cy="130" r="16" class="call"/><text x="527" y="136" class="num">1</text>
  <text x="560" y="136" class="txt">Double-click any operator node</text>

  <rect x="650" y="60" width="596" height="606" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <rect x="680" y="90" width="536" height="48" rx="24" fill="#eef2f7"/>
  <text x="702" y="120" class="label">RESOURCE</text>
  <text x="820" y="120" class="txt">Customer HTTP call</text>
  <circle cx="1210" cy="114" r="15" fill="#e2e8f0"/><text x="1203" y="120" class="small">X</text>

  <circle cx="686" cy="174" r="16" class="call"/><text x="681" y="180" class="num">2</text>
  <text x="718" y="180" class="txt">Editable key properties</text>
  <rect x="680" y="200" width="250" height="128" rx="8" class="soft"/>
  <text x="700" y="228" class="label">Node label</text>
  <rect x="700" y="238" width="200" height="24" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="710" y="255" class="code">Customer HTTP call</text>
  <text x="700" y="286" class="label">Method / URL / Timeout</text>
  <rect x="700" y="296" width="58" height="24" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="714" y="313" class="code">POST</text>
  <rect x="768" y="296" width="132" height="24" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="778" y="313" class="code">/customers/{id}</text>

  <circle cx="966" cy="174" r="16" class="call"/><text x="961" y="180" class="num">3</text>
  <text x="998" y="180" class="txt">Graphical input binding</text>
  <rect x="960" y="200" width="246" height="128" rx="8" class="soft"/>
  <text x="980" y="228" class="label">Node Inputs</text>
  <rect x="980" y="244" width="206" height="34" rx="5" fill="#eef4ff" stroke="#b7c9e8"/>
  <text x="996" y="266" class="code">ctx.request.customerId</text>
  <text x="980" y="306" class="small">targetPort=input, targetPath=customerId</text>

  <circle cx="686" cy="368" r="16" class="call"/><text x="681" y="374" class="num">4</text>
  <text x="718" y="374" class="txt">Input / output samples</text>
  <rect x="680" y="394" width="250" height="132" rx="8" class="soft"/>
  <text x="700" y="422" class="label">Output sample</text>
  <rect x="700" y="434" width="200" height="34" rx="5" fill="#111827"/>
  <text x="712" y="456" fill="#e5e7eb" font-family="ui-monospace,monospace" font-size="13">{"ok":true}</text>
  <text x="700" y="494" class="label">Expected input</text>
  <rect x="700" y="506" width="200" height="14" rx="4" fill="#fff" stroke="#cbd5e1"/>

  <circle cx="966" cy="368" r="16" class="call"/><text x="961" y="374" class="num">5</text>
  <text x="998" y="374" class="txt">Schema summaries first</text>
  <rect x="960" y="394" width="246" height="132" rx="8" class="soft"/>
  <text x="980" y="422" class="label">Input schema</text>
  <rect x="980" y="434" width="74" height="22" rx="4" fill="#eef2f7"/>
  <text x="994" y="450" class="small">object</text>
  <rect x="1064" y="434" width="74" height="22" rx="4" fill="#eef2f7"/>
  <text x="1080" y="450" class="small">0 fields</text>
  <text x="980" y="486" class="label">Output schema</text>
  <text x="980" y="514" class="small">Raw JSON stays expandable for experts</text>

  <circle cx="686" cy="566" r="16" class="call"/><text x="681" y="572" class="num">6</text>
  <text x="718" y="572" class="txt">Advanced config remains available</text>
  <rect x="680" y="596" width="526" height="42" rx="8" fill="#111827"/>
  <text x="700" y="623" fill="#e5e7eb" font-family="ui-monospace,monospace" font-size="13">{"method":"POST","url":"/customers/{id}"}</text>
</svg>
