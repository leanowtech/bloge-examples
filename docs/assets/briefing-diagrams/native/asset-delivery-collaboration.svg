<svg class="native-report-svg native-delivery-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 650" role="img" aria-labelledby="delivery-flow-title delivery-flow-desc">
  <title id="delivery-flow-title">业务资产交付协作模型</title>
  <desc id="delivery-flow-desc">业务 Owner、编码智能体、平台工程和质量治理围绕意图、变更集、规范合同、执行计划、验证证据和发布版本协作。</desc>
  <defs>
    <marker id="delivery-blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2F6F9F"/></marker>
    <marker id="delivery-red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B14D3C"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.eyebrow{font-size:13px;font-weight:750;letter-spacing:1.2px}.title{font-size:19px;font-weight:750}.phase{font-size:14px;font-weight:750}.role{font-size:14px;font-weight:750}.label{font-size:14px;font-weight:700}.micro{font-size:12px;fill:#66768A}.cell{fill:#FFF;stroke:#DCE4EC}.blue{fill:#EDF5FA;stroke:#2F6F9F;stroke-width:1.5}.purple{fill:#EDF5F3;stroke:#2C7A6B;stroke-width:1.5}.amber{fill:#FBF6EA;stroke:#8C5B16;stroke-width:1.5}.green{fill:#EEF7F2;stroke:#2F7D59;stroke-width:1.5}.flow{fill:none;stroke:#2F6F9F;stroke-width:3;marker-end:url(#delivery-blue-arrow)}.feedback{fill:none;stroke:#B14D3C;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#delivery-red-arrow)}
    </style>
  </defs>
  <rect width="1320" height="650" rx="20" fill="#FFF"/>
  <text x="38" y="42" class="eyebrow" style="fill:#2F6F9F">ASSET DELIVERY OPERATING MODEL</text>
  <text x="38" y="72" class="title">角色围绕同一组可执行资产协作，失败回到具体产物而不是口头协调</text>

  <rect x="38" y="104" width="1244" height="420" rx="16" fill="#F6F8FB" stroke="#DCE4EC"/>
  <line x1="200" y1="104" x2="200" y2="524" stroke="#DCE4EC"/>
  <line x1="200" y1="168" x2="1282" y2="168" stroke="#DCE4EC"/>
  <line x1="38" y1="257" x2="1282" y2="257" stroke="#DCE4EC"/>
  <line x1="38" y1="346" x2="1282" y2="346" stroke="#DCE4EC"/>
  <line x1="38" y1="435" x2="1282" y2="435" stroke="#DCE4EC"/>
  <line x1="380" y1="104" x2="380" y2="524" stroke="#DCE4EC"/>
  <line x1="560" y1="104" x2="560" y2="524" stroke="#DCE4EC"/>
  <line x1="740" y1="104" x2="740" y2="524" stroke="#DCE4EC"/>
  <line x1="920" y1="104" x2="920" y2="524" stroke="#DCE4EC"/>
  <line x1="1100" y1="104" x2="1100" y2="524" stroke="#DCE4EC"/>

  <text x="62" y="143" class="eyebrow" style="fill:#66768A">责任 / 阶段</text>
  <text x="290" y="143" text-anchor="middle" class="phase">定义</text><text x="470" y="143" text-anchor="middle" class="phase">创作</text><text x="650" y="143" text-anchor="middle" class="phase">编译</text><text x="830" y="143" text-anchor="middle" class="phase">计划</text><text x="1010" y="143" text-anchor="middle" class="phase">验证</text><text x="1190" y="143" text-anchor="middle" class="phase">发布</text>
  <text x="62" y="210" class="role" style="fill:#8C5B16">业务 Owner / 运营</text><text x="62" y="233" class="micro">意图与正确性负责人</text>
  <text x="62" y="299" class="role" style="fill:#2C7A6B">编码智能体</text><text x="62" y="322" class="micro">工程化变更执行者</text>
  <text x="62" y="388" class="role" style="fill:#2F6F9F">平台工程</text><text x="62" y="411" class="micro">确定性与隔离边界</text>
  <text x="62" y="477" class="role" style="fill:#2F7D59">质量治理</text><text x="62" y="500" class="micro">证据与晋级规则</text>

  <rect x="218" y="184" width="144" height="54" rx="10" class="amber"/><text x="290" y="207" text-anchor="middle" class="label">IntentSpec</text><text x="290" y="226" text-anchor="middle" class="micro">Oracle · 风险</text>
  <rect x="398" y="273" width="144" height="54" rx="10" class="purple"/><text x="470" y="296" text-anchor="middle" class="label">ChangeSet</text><text x="470" y="315" text-anchor="middle" class="micro">DSL · Scenario</text>
  <rect x="578" y="362" width="144" height="54" rx="10" class="blue"/><text x="650" y="385" text-anchor="middle" class="label">Canonical Contract</text><text x="650" y="404" text-anchor="middle" class="micro">Fingerprint · Impact</text>
  <rect x="758" y="362" width="144" height="54" rx="10" class="blue"/><text x="830" y="385" text-anchor="middle" class="label">Execution Plan</text><text x="830" y="404" text-anchor="middle" class="micro">Purpose · Selector</text>
  <rect x="938" y="451" width="144" height="54" rx="10" class="green"/><text x="1010" y="474" text-anchor="middle" class="label">Evidence</text><text x="1010" y="493" text-anchor="middle" class="micro">Trace · Coverage</text>
  <rect x="1118" y="184" width="144" height="54" rx="10" class="green"/><text x="1190" y="207" text-anchor="middle" class="label">Publication</text><text x="1190" y="226" text-anchor="middle" class="micro">Approve · Audit</text>

  <path d="M362 211 H372 V300 H388" class="flow"/><path d="M542 300 H552 V389 H568" class="flow"/><path d="M722 389 H748" class="flow"/><path d="M902 389 H912 V478 H928" class="flow"/><path d="M1082 478 H1092 V211 H1108" class="flow"/>

  <rect x="38" y="552" width="1244" height="66" rx="13" fill="#FBF1EF" stroke="#E2B8B1" stroke-dasharray="8 6"/>
  <path d="M1010 505 V538 H470 V337" class="feedback"/>
  <text x="64" y="580" class="label" style="fill:#8E3E32">诊断闭环</text>
  <text x="154" y="580" class="micro" style="fill:#8E3E32">Schema 漂移 → Contract　·　Fixture 未命中 → 测试资产　·　断言失败 → Graph / Decision　·　运行失败 → Binding / Adapter</text>
  <text x="64" y="601" class="micro">过程质量指标来自资产 Diff、编译诊断、语义覆盖、人工修正和 Evidence 完整度，而不是仅统计发布次数。</text>
</svg>
