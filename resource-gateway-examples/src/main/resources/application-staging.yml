gateway:
  integration:
    identity:
      environment-id: ${RG_INTEGRATION_ENVIRONMENT_ID:staging}
      allowed-purposes: ${RG_INTEGRATION_ALLOWED_PURPOSES:GOVERNANCE_EVIDENCE_INGESTION,PAYLOAD_REPLAY,PAYLOAD_RETENTION_ADMIN,LEGAL_HOLD,GOVERNANCE_GATE_FEEDBACK,CHANGE_SYNC,SIDE_EFFECT_RECONCILIATION,TEST_EXECUTION,TEST_FIXTURE_READ,TEST_FIXTURE_WRITE,TEST_REPLAY,TEST_SUITE_READ,TEST_SUITE_WRITE,TEST_RUNTIME_MAINTENANCE}
  testing:
    admission:
      policy-generation: ${RG_TEST_ADMISSION_POLICY_GENERATION:1}
      tenant-max-active: ${RG_TEST_ADMISSION_TENANT_MAX_ACTIVE:16}
      suite-max-active: ${RG_TEST_ADMISSION_SUITE_MAX_ACTIVE:2}
      operator-max-active: ${RG_TEST_ADMISSION_OPERATOR_MAX_ACTIVE:8}
      dependency-max-active: ${RG_TEST_ADMISSION_DEPENDENCY_MAX_ACTIVE:4}
      lease-duration-seconds: ${RG_TEST_ADMISSION_LEASE_SECONDS:30}
      heartbeat-interval-seconds: ${RG_TEST_ADMISSION_HEARTBEAT_SECONDS:5}
      instance-id: ${RG_TEST_ADMISSION_INSTANCE_ID:}
      cleanup-interval-ms: ${RG_TEST_ADMISSION_CLEANUP_INTERVAL_MS:60000}
      cleanup-batch-size: ${RG_TEST_ADMISSION_CLEANUP_BATCH_SIZE:1000}
    durable:
      owner-claims:
        instance-id: ${RG_TEST_DURABLE_OWNER_INSTANCE_ID:}
        lease-duration-seconds: ${RG_TEST_DURABLE_OWNER_LEASE_SECONDS:120}
      worker-acquisitions:
        candidate-limit: ${RG_TEST_DURABLE_WORKER_CANDIDATE_LIMIT:32}
      heartbeats:
        lease-duration-seconds: ${RG_TEST_DURABLE_HEARTBEAT_LEASE_SECONDS:120}
      recovery-worker:
        heartbeat-interval-seconds: ${RG_TEST_DURABLE_RECOVERY_HEARTBEAT_INTERVAL_SECONDS:0}
      projection-findings:
        required-group: ${RG_TEST_PROJECTION_FINDING_REQUIRED_GROUP:resource-gateway-test-runtime-operators}
        required-clearance: ${RG_TEST_PROJECTION_FINDING_REQUIRED_CLEARANCE:RESTRICTED}
        resolved-retention-days: ${RG_TEST_PROJECTION_FINDING_RESOLVED_RETENTION_DAYS:30}
        archive-retention-days: ${RG_TEST_PROJECTION_FINDING_ARCHIVE_RETENTION_DAYS:365}
        retention-page-size: ${RG_TEST_PROJECTION_FINDING_RETENTION_PAGE_SIZE:100}
        retention-interval-ms: ${RG_TEST_PROJECTION_FINDING_RETENTION_INTERVAL_MS:3600000}
      projection-slo:
        observation-interval-ms: ${RG_TEST_PROJECTION_SLO_OBSERVATION_INTERVAL_MS:30000}
        startup-grace-seconds: ${RG_TEST_PROJECTION_SLO_STARTUP_GRACE_SECONDS:180}
        max-reconciliation-staleness-seconds: ${RG_TEST_PROJECTION_SLO_MAX_RECONCILIATION_STALENESS_SECONDS:180}
        max-retention-staleness-seconds: ${RG_TEST_PROJECTION_SLO_MAX_RETENTION_STALENESS_SECONDS:10800}
        max-unresolved-findings: ${RG_TEST_PROJECTION_SLO_MAX_UNRESOLVED_FINDINGS:0}
        max-unresolved-age-seconds: ${RG_TEST_PROJECTION_SLO_MAX_UNRESOLVED_AGE_SECONDS:3600}
        max-overdue-resolved-findings: ${RG_TEST_PROJECTION_SLO_MAX_OVERDUE_RESOLVED_FINDINGS:0}
        max-overdue-archive-records: ${RG_TEST_PROJECTION_SLO_MAX_OVERDUE_ARCHIVE_RECORDS:0}
    suite-runs:
      instance-id: ${RG_TEST_SUITE_RUNNER_INSTANCE_ID:}
      lease-duration-seconds: ${RG_TEST_SUITE_LEASE_SECONDS:30}
      heartbeat-interval-seconds: ${RG_TEST_SUITE_HEARTBEAT_SECONDS:5}
      reconciliation-interval-ms: ${RG_TEST_SUITE_RECONCILIATION_INTERVAL_MS:15000}
      reconciliation-batch-size: ${RG_TEST_SUITE_RECONCILIATION_BATCH_SIZE:100}
    replay-payloads:
      maximum-retention-days: ${RG_TEST_REPLAY_MAX_RETENTION_DAYS:30}
      sweep-interval-ms: ${RG_TEST_REPLAY_SWEEP_INTERVAL_MS:60000}
      sweep-batch-size: ${RG_TEST_REPLAY_SWEEP_BATCH_SIZE:100}
    runtime-slo:
      observation-interval-ms: ${RG_TEST_RUNTIME_SLO_OBSERVATION_INTERVAL_MS:30000}
      outcome-lookback-seconds: ${RG_TEST_RUNTIME_SLO_OUTCOME_LOOKBACK_SECONDS:900}
      execution-minimum-samples: ${RG_TEST_RUNTIME_SLO_EXECUTION_MINIMUM_SAMPLES:20}
      execution-max-incomplete-basis-points: ${RG_TEST_RUNTIME_SLO_EXECUTION_MAX_INCOMPLETE_BASIS_POINTS:0}
      suite-minimum-samples: ${RG_TEST_RUNTIME_SLO_SUITE_MINIMUM_SAMPLES:5}
      suite-max-incomplete-basis-points: ${RG_TEST_RUNTIME_SLO_SUITE_MAX_INCOMPLETE_BASIS_POINTS:0}
      suite-max-depth: ${RG_TEST_RUNTIME_SLO_SUITE_MAX_DEPTH:100}
      suite-max-expired-leases: ${RG_TEST_RUNTIME_SLO_SUITE_MAX_EXPIRED_LEASES:0}
      suite-max-oldest-age-seconds: ${RG_TEST_RUNTIME_SLO_SUITE_MAX_OLDEST_AGE_SECONDS:120}
      creation-max-depth: ${RG_TEST_RUNTIME_SLO_CREATION_MAX_DEPTH:100}
      creation-max-expired-leases: ${RG_TEST_RUNTIME_SLO_CREATION_MAX_EXPIRED_LEASES:0}
      creation-max-oldest-age-seconds: ${RG_TEST_RUNTIME_SLO_CREATION_MAX_OLDEST_AGE_SECONDS:180}
      durable-max-depth: ${RG_TEST_RUNTIME_SLO_DURABLE_MAX_DEPTH:1000}
      durable-max-expired-leases: ${RG_TEST_RUNTIME_SLO_DURABLE_MAX_EXPIRED_LEASES:0}
      durable-max-oldest-age-seconds: ${RG_TEST_RUNTIME_SLO_DURABLE_MAX_OLDEST_AGE_SECONDS:180}
      work-max-depth: ${RG_TEST_RUNTIME_SLO_WORK_MAX_DEPTH:10000}
      work-max-expired-claims: ${RG_TEST_RUNTIME_SLO_WORK_MAX_EXPIRED_CLAIMS:0}
      work-max-oldest-age-seconds: ${RG_TEST_RUNTIME_SLO_WORK_MAX_OLDEST_AGE_SECONDS:300}
      max-expired-execution-records: ${RG_TEST_RUNTIME_SLO_MAX_EXPIRED_EXECUTION_RECORDS:0}
      max-expired-suite-records: ${RG_TEST_RUNTIME_SLO_MAX_EXPIRED_SUITE_RECORDS:0}
      max-terminal-durable-executions: ${RG_TEST_RUNTIME_SLO_MAX_TERMINAL_DURABLE_EXECUTIONS:10000}
      max-terminal-work-items: ${RG_TEST_RUNTIME_SLO_MAX_TERMINAL_WORK_ITEMS:100000}
    store:
      jdbc-url: ${RG_TEST_STORE_JDBC_URL:jdbc:h2:file:./data/resource-gateway-test-runtime-staging;AUTO_SERVER=TRUE}
      username: ${RG_TEST_STORE_USERNAME:sa}
      password: ${RG_TEST_STORE_PASSWORD:}
      maximum-pool-size: ${RG_TEST_STORE_MAXIMUM_POOL_SIZE:4}
      retention-days: ${RG_TEST_STORE_RETENTION_DAYS:30}
