          maximum-inventory-snapshot-age-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_INVENTORY_MAXIMUM_AGE_SECONDS:300}
          allow-insecure-loopback: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_ALLOW_INSECURE_LOOPBACK:false}
