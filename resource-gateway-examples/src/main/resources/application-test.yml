          inventory-page-size: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_INVENTORY_PAGE_SIZE:100}
          comparison-page-size: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_COMPARISON_PAGE_SIZE:100}
          finding-page-size: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_FINDING_PAGE_SIZE:100}
          initial-delay-ms: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_INITIAL_DELAY_MS:60000}
          interval-ms: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_INTERVAL_MS:300000}
          retention-lease-duration-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_RETENTION_LEASE_SECONDS:120}
          resolved-retention-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_RESOLVED_RETENTION_SECONDS:2592000}
          archive-retention-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_ARCHIVE_RETENTION_SECONDS:31536000}
          evidence-retention-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_EVIDENCE_RETENTION_SECONDS:31536000}
          retention-page-size: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_RETENTION_PAGE_SIZE:100}
          retention-initial-delay-ms: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_RETENTION_INITIAL_DELAY_MS:300000}
          retention-interval-ms: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_RETENTION_INTERVAL_MS:3600000}
          source-retention-lease-duration-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_SOURCE_RETENTION_LEASE_SECONDS:120}
          source-processed-retention-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_SOURCE_PROCESSED_RETENTION_SECONDS:31536000}
          source-expired-retention-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_SOURCE_EXPIRED_RETENTION_SECONDS:2592000}
          source-retention-page-size: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_SOURCE_RETENTION_PAGE_SIZE:100}
          source-retention-initial-delay-ms: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_SOURCE_RETENTION_INITIAL_DELAY_MS:300000}
          source-retention-interval-ms: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_SOURCE_RETENTION_INTERVAL_MS:3600000}
          health-observation-interval-ms: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_HEALTH_OBSERVATION_INTERVAL_MS:30000}
          health-startup-grace-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_HEALTH_STARTUP_GRACE_SECONDS:7200}
          health-maximum-scheduler-staleness-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_HEALTH_MAXIMUM_SCHEDULER_STALENESS_SECONDS:900}
          health-maximum-consecutive-unhealthy-ticks: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_HEALTH_MAXIMUM_CONSECUTIVE_UNHEALTHY_TICKS:2}
          health-maximum-stage-idle-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_HEALTH_MAXIMUM_STAGE_IDLE_SECONDS:1800}
          health-maximum-completed-evidence-age-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_HEALTH_MAXIMUM_COMPLETED_EVIDENCE_AGE_SECONDS:86400}
          health-maximum-retention-staleness-seconds: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_HEALTH_MAXIMUM_RETENTION_STALENESS_SECONDS:7200}
          health-maximum-overdue-resolved-findings: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_HEALTH_MAXIMUM_OVERDUE_RESOLVED_FINDINGS:0}
          health-maximum-overdue-archives: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_RECONCILIATION_HEALTH_MAXIMUM_OVERDUE_ARCHIVES:0}
