          endpoints-json: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_ENDPOINTS_JSON:[]}
          request-timeout-ms: ${RG_TEST_STABILITY_OBSERVATION_ARCHIVE_TIMEOUT_MS:3000}
