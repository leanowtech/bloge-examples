# ─────────────────────────────────────────────────────────────────────────────
# BLOGE Resource Gateway — example application configuration
# ─────────────────────────────────────────────────────────────────────────────

server:
  port: 8080

spring:
  application:
    name: bloge-resource-gateway

  threads:
    virtual:
      enabled: true


  # ── Embedded H2 persistence for resource descriptors ──────────────────
  datasource:
    url: jdbc:h2:file:./target/bloge-resource-gateway;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # ── Jackson defaults ──────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false

# ── BLOGE engine ──────────────────────────────────────────────────────────
spring.bloge:
  dsl-locations: classpath:bloge/gateway
  engine-mode: request-response

# ── Gateway layer ────────────────────────────────────────────────────────
gateway:
  # Base URL for seeded resource descriptors.
  # By default the example points at its own built-in demo upstream controller so the
  # documented curl examples work without any extra services.
  # Override with WireMock or a real upstream base URL when needed.
  base-url: http://localhost:${server.port}/demo-upstream
  # Automatically seed or refresh the built-in demo descriptors on startup.
  seed-descriptors: true
  testing:
    mirror:
      # Requires the test or staging profile and is physically excluded whenever production is active.
      enabled: ${RG_MIRROR_RUNTIME_ENABLED:false}
      outcome-continuous-assessment:
        scheduler:
          # Opt-in exact-population freshness projection; all customer authorities must also exist.
          enabled: ${RG_MIRROR_OUTCOME_CONTINUOUS_ASSESSMENT_SCHEDULER_ENABLED:false}
          instance-id: ${RG_MIRROR_OUTCOME_CONTINUOUS_ASSESSMENT_INSTANCE_ID:}
          region: ${RG_MIRROR_OUTCOME_CONTINUOUS_ASSESSMENT_REGION:}
          environment-id: ${RG_MIRROR_OUTCOME_CONTINUOUS_ASSESSMENT_ENVIRONMENT:}
          maximum-pollers: ${RG_MIRROR_OUTCOME_CONTINUOUS_ASSESSMENT_MAXIMUM_POLLERS:2}
          initial-delay-millis: ${RG_MIRROR_OUTCOME_CONTINUOUS_ASSESSMENT_INITIAL_DELAY_MILLIS:1000}
          poll-interval-millis: ${RG_MIRROR_OUTCOME_CONTINUOUS_ASSESSMENT_POLL_INTERVAL_MILLIS:1000}
          drain-timeout-millis: ${RG_MIRROR_OUTCOME_CONTINUOUS_ASSESSMENT_DRAIN_TIMEOUT_MILLIS:30000}
      shadow-job:
        scheduler:
          # Optional bounded pollers; the trusted data-plane SPI still controls worker readiness.
          enabled: ${RG_MIRROR_SHADOW_JOB_SCHEDULER_ENABLED:false}
          instance-id: ${RG_MIRROR_SHADOW_JOB_INSTANCE_ID:}
          region: ${RG_MIRROR_SHADOW_JOB_REGION:}
          environment-id: ${RG_MIRROR_SHADOW_JOB_ENVIRONMENT:}
          maximum-pollers: ${RG_MIRROR_SHADOW_JOB_MAXIMUM_POLLERS:2}
          initial-delay-millis: ${RG_MIRROR_SHADOW_JOB_INITIAL_DELAY_MILLIS:1000}
          poll-interval-millis: ${RG_MIRROR_SHADOW_JOB_POLL_INTERVAL_MILLIS:1000}
          drain-timeout-millis: ${RG_MIRROR_SHADOW_JOB_DRAIN_TIMEOUT_MILLIS:30000}
      scenario-batch:
        scheduler:
          # Explicit non-production worker activation; one process serves one regional partition.
          enabled: ${RG_MIRROR_SCENARIO_BATCH_SCHEDULER_ENABLED:false}
          instance-id: ${RG_MIRROR_SCENARIO_BATCH_INSTANCE_ID:}
          region: ${RG_MIRROR_SCENARIO_BATCH_REGION:}
          environment-id: ${RG_MIRROR_SCENARIO_BATCH_ENVIRONMENT:}
          maximum-pollers: ${RG_MIRROR_SCENARIO_BATCH_MAXIMUM_POLLERS:4}
          initial-delay-millis: ${RG_MIRROR_SCENARIO_BATCH_INITIAL_DELAY_MILLIS:1000}
          poll-interval-millis: ${RG_MIRROR_SCENARIO_BATCH_POLL_INTERVAL_MILLIS:1000}
          drain-timeout-millis: ${RG_MIRROR_SCENARIO_BATCH_DRAIN_TIMEOUT_MILLIS:30000}
        finalization-scheduler:
          # Separate KMS lanes finalize durable outbox intents without holding DAG queue locks.
          enabled: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_SCHEDULER_ENABLED:false}
          instance-id: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_INSTANCE_ID:}
          region: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_REGION:}
          environment-id: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_ENVIRONMENT:}
          maximum-pollers: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_MAXIMUM_POLLERS:1}
          initial-delay-millis: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_INITIAL_DELAY_MILLIS:1000}
          poll-interval-millis: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_POLL_INTERVAL_MILLIS:1000}
          drain-timeout-millis: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_DRAIN_TIMEOUT_MILLIS:30000}
        finalization-slo:
          # Closed aggregate thresholds shared by protected health, Actuator, and metrics.
          observation-interval-millis: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_SLO_OBSERVATION_INTERVAL_MILLIS:30000}
          maximum-eligible-backlog: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_SLO_MAXIMUM_ELIGIBLE_BACKLOG:100}
          maximum-oldest-eligible-age-seconds: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_SLO_MAXIMUM_OLDEST_ELIGIBLE_AGE_SECONDS:300}
          maximum-active-signing-age-seconds: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_SLO_MAXIMUM_ACTIVE_SIGNING_AGE_SECONDS:90}
          maximum-quarantined-backlog: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_SLO_MAXIMUM_QUARANTINED_BACKLOG:0}
          critical-quarantined-backlog: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_SLO_CRITICAL_QUARANTINED_BACKLOG:100}
          maximum-signer-unavailable-backlog: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_SLO_MAXIMUM_SIGNER_UNAVAILABLE_BACKLOG:10}
          maximum-control-unavailable-backlog: ${RG_MIRROR_SCENARIO_BATCH_FINALIZATION_SLO_MAXIMUM_CONTROL_UNAVAILABLE_BACKLOG:10}
      stateful:
        # Separate opt-in: missing encryption keys or a state-plane outage fail startup/readiness closed.
        enabled: ${RG_MIRROR_STATEFUL_ENABLED:false}
        instance-id: ${RG_MIRROR_STATEFUL_INSTANCE_ID:}
        lease-duration-seconds: ${RG_MIRROR_STATEFUL_LEASE_SECONDS:30}
        capacity:
          # Database-authoritative global/per-scope limits plus fail-fast replica backpressure.
          maximum-active-sessions: ${RG_MIRROR_STATEFUL_MAXIMUM_ACTIVE_SESSIONS:1000}
          maximum-scope-active-sessions: ${RG_MIRROR_STATEFUL_MAXIMUM_SCOPE_ACTIVE_SESSIONS:100}
          maximum-retained-payload-bytes: ${RG_MIRROR_STATEFUL_MAXIMUM_RETAINED_PAYLOAD_BYTES:4294967296}
          maximum-scope-retained-payload-bytes: ${RG_MIRROR_STATEFUL_MAXIMUM_SCOPE_RETAINED_PAYLOAD_BYTES:536870912}
          maximum-concurrent-commands: ${RG_MIRROR_STATEFUL_MAXIMUM_CONCURRENT_COMMANDS:32}
        expiry:
          # Bounded oldest-first ciphertext erasure; the store serializes competing replicas.
          batch-size: ${RG_MIRROR_STATEFUL_EXPIRY_BATCH_SIZE:100}
          sweep-interval-millis: ${RG_MIRROR_STATEFUL_EXPIRY_SWEEP_INTERVAL_MILLIS:30000}
        write-attempt-reconciliation:
          # Bounded short transactions reconcile lease-expired intents from the receipt journal.
          batch-size: ${RG_MIRROR_STATEFUL_WRITE_ATTEMPT_RECONCILIATION_BATCH_SIZE:100}
          sweep-interval-millis: ${RG_MIRROR_STATEFUL_WRITE_ATTEMPT_RECONCILIATION_SWEEP_INTERVAL_MILLIS:5000}
        datasource:
          # This must remain a physically distinct database/credential in managed deployments.
          url: ${RG_MIRROR_STATEFUL_JDBC_URL:jdbc:h2:file:./target/bloge-resource-gateway-mirror-state;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
          username: ${RG_MIRROR_STATEFUL_JDBC_USERNAME:sa}
          password: ${RG_MIRROR_STATEFUL_JDBC_PASSWORD:}
          maximum-pool-size: ${RG_MIRROR_STATEFUL_JDBC_MAXIMUM_POOL_SIZE:4}
        encryption:
          # Comma-separated keyId=base64(AES-256-key); prior keys remain decrypt-only during rotation.
          active-key-id: ${RG_MIRROR_STATEFUL_ACTIVE_KEY_ID:}
          key-ring: ${RG_MIRROR_STATEFUL_KEY_RING:}
  integration:
    evidence-signing:
      # Production path: Resource Gateway keeps public verification keys only; the sidecar owns KMS/HSM access.
      managed:
        enabled: ${RG_EVIDENCE_SIGNING_MANAGED_ENABLED:false}
        base-uri: ${RG_EVIDENCE_SIGNING_MANAGED_BASE_URI:}
        provider-name: ${RG_EVIDENCE_SIGNING_MANAGED_PROVIDER_NAME:enterprise-kms}
        request-timeout-seconds: ${RG_EVIDENCE_SIGNING_MANAGED_REQUEST_TIMEOUT_SECONDS:3}
        refresh-interval-seconds: ${RG_EVIDENCE_SIGNING_MANAGED_REFRESH_INTERVAL_SECONDS:30}
        unknown-key-refresh-interval-seconds: ${RG_EVIDENCE_SIGNING_MANAGED_UNKNOWN_KEY_REFRESH_INTERVAL_SECONDS:5}
        maximum-snapshot-lifetime-seconds: ${RG_EVIDENCE_SIGNING_MANAGED_MAXIMUM_SNAPSHOT_LIFETIME_SECONDS:86400}
        # Test-only escape hatch; non-loopback HTTP is always rejected.
        allow-insecure-loopback: ${RG_EVIDENCE_SIGNING_MANAGED_ALLOW_INSECURE_LOOPBACK:false}
    payload-governance:
      # Payloads are detached from immutable run evidence. A classification policy decides whether
      # sanitized values enter the expirable vault; RESTRICTED defaults to no retention.
      policy-id: ${RG_PAYLOAD_POLICY_ID:resource-gateway-demo}
      policy-version: ${RG_PAYLOAD_POLICY_VERSION:1}
      default-classification: ${RG_PAYLOAD_DEFAULT_CLASSIFICATION:CONFIDENTIAL}
      required-groups: ${RG_PAYLOAD_REQUIRED_GROUPS:}
      sweep-interval-ms: ${RG_PAYLOAD_SWEEP_INTERVAL_MS:60000}
      sweep-batch-size: ${RG_PAYLOAD_SWEEP_BATCH_SIZE:200}
      retention-days:
        public: ${RG_PAYLOAD_RETENTION_PUBLIC_DAYS:30}
        internal: ${RG_PAYLOAD_RETENTION_INTERNAL_DAYS:14}
        confidential: ${RG_PAYLOAD_RETENTION_CONFIDENTIAL_DAYS:7}
        restricted: ${RG_PAYLOAD_RETENTION_RESTRICTED_DAYS:0}
    identity:
      # Production mode verifies short-lived RS256/EdDSA JWTs against configured public keys.
      # A custom IntegrationJwtTrustStore bean can source rotating keys and revocation from JWKS/KMS.
      jwt:
        enabled: ${RG_INTEGRATION_JWT_ENABLED:false}
        issuer: ${RG_INTEGRATION_JWT_ISSUER:}
        audience: ${RG_INTEGRATION_JWT_AUDIENCE:}
        trusted-keys-json: ${RG_INTEGRATION_JWT_TRUSTED_KEYS_JSON:}
        revoked-key-ids: ${RG_INTEGRATION_JWT_REVOKED_KEY_IDS:}
        revoked-token-ids: ${RG_INTEGRATION_JWT_REVOKED_TOKEN_IDS:}
        # When jwks-uri is set, keys and the optional revocation feed refresh as one atomic snapshot.
        jwks-uri: ${RG_INTEGRATION_JWT_JWKS_URI:}
        revocations-uri: ${RG_INTEGRATION_JWT_REVOCATIONS_URI:}
        refresh-interval-seconds: ${RG_INTEGRATION_JWT_REFRESH_INTERVAL_SECONDS:30}
        unknown-key-refresh-interval-seconds: ${RG_INTEGRATION_JWT_UNKNOWN_KEY_REFRESH_INTERVAL_SECONDS:5}
        request-timeout-seconds: ${RG_INTEGRATION_JWT_REQUEST_TIMEOUT_SECONDS:3}
        outage-policy: ${RG_INTEGRATION_JWT_OUTAGE_POLICY:FAIL_CLOSED}
        maximum-stale-seconds: ${RG_INTEGRATION_JWT_MAXIMUM_STALE_SECONDS:0}
        # Test-only escape hatch; non-loopback HTTP is always rejected.
        allow-insecure-loopback: ${RG_INTEGRATION_JWT_ALLOW_INSECURE_LOOPBACK:false}
        clock-skew-seconds: ${RG_INTEGRATION_JWT_CLOCK_SKEW_SECONDS:30}
        maximum-lifetime-seconds: ${RG_INTEGRATION_JWT_MAXIMUM_LIFETIME_SECONDS:900}
      # Explicit demo-only fallback. Disable it whenever signed JWT or a custom resolver is used.
      demo-enabled: ${RG_INTEGRATION_DEMO_IDENTITY_ENABLED:true}
      demo-token: ${RG_INTEGRATION_DEMO_TOKEN:bloge-aneke-demo-token}
      identity-id: ${RG_INTEGRATION_IDENTITY_ID:demo-aneke-workload}
      tenant-id: ${RG_INTEGRATION_TENANT_ID:tenant-a}
      organization-id: ${RG_INTEGRATION_ORGANIZATION_ID:knowledge-governance}
      project-id: ${RG_INTEGRATION_PROJECT_ID:tool-studio}
      environment-id: ${RG_INTEGRATION_ENVIRONMENT_ID:prod}
      region: ${RG_INTEGRATION_REGION:local}
      actor-id: ${RG_INTEGRATION_ACTOR_ID:aneke-sync}
      groups: ${RG_INTEGRATION_GROUPS:payload-governance}
      clearance: ${RG_INTEGRATION_CLEARANCE:CONFIDENTIAL}
      allowed-purposes: ${RG_INTEGRATION_ALLOWED_PURPOSES:GOVERNANCE_EVIDENCE_INGESTION,PAYLOAD_REPLAY,PAYLOAD_RETENTION_ADMIN,LEGAL_HOLD,GOVERNANCE_GATE_FEEDBACK,CHANGE_SYNC,SIDE_EFFECT_RECONCILIATION,CAPABILITY_PROJECTION,CAPABILITY_GOVERNANCE,MIRROR_REHEARSAL,MIRROR_REHEARSAL_FINALIZATION_ADMIN,MIRROR_SHADOW}

# ── Logging ───────────────────────────────────────────────────────────────
logging:
  level:
    com.leanowtech.bloge.gateway: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{tenantId:-system}] %-5level %logger{36} - %msg%n"
