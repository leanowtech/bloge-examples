server:
  port: 0

spring:
  application:
    name: bloge-resource-gateway-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jackson:
    serialization:
      write-dates-as-timestamps: false

spring.bloge:
  dsl-locations: classpath:bloge/gateway

gateway:
  base-url: http://localhost:${wiremock.server.port:9999}
  seed-descriptors: true

logging:
  level:
    com.leanowtech.bloge.gateway: WARN
