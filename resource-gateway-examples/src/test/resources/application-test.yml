server:
  port: 0

spring:
  application:
    name: bloge-resource-gateway-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jackson:
    serialization:
      write-dates-as-timestamps: false

spring.bloge:
  dsl-locations: classpath:bloge/gateway

gateway:
  base-url: http://localhost:${wiremock.server.port:9999}
  seed-descriptors: true
  testing:
    authoring-fixtures:
      payload-protection:
        active-key-id: test-authoring-v1
        key-ring: test-authoring-v1=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      sweep-interval-ms: 60000
      sweep-batch-size: 25

logging:
  level:
    com.leanowtech.bloge.gateway: WARN
